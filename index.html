<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Meta viewport ini sangat penting agar responsif di HP -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hacker Browser Responsive</title>
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #050505; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace; 
            padding: 10px; /* Memberi jarak agar tidak menempel di tepi layar HP */
        }

        /* ------------------------- */
        /* WADAH UTAMA BROWSER       */
        /* ------------------------- */
        .browser-window {
            width: 100%;
            max-width: 1000px;
            height: 85vh;
            background: #000000;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #003300;
        }

        /* ------------------------- */
        /* BAGIAN ATAS (TOOLBAR)     */
        /* ------------------------- */
        .browser-header {
            background: #0a0a0a;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #00ff00;
            gap: 15px;
        }

        .window-controls {
            display: flex;
            gap: 8px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            box-shadow: 0 0 5px currentColor;
        }
        .dot.close { background: #ff2a2a; color: #ff2a2a; }
        .dot.minimize { background: #ffcc00; color: #ffcc00; }
        .dot.maximize { background: #00ff00; color: #00ff00; }

        .nav-buttons {
            display: flex;
            gap: 12px;
            color: #00ff00;
            font-size: 16px;
        }
        .nav-buttons i { 
            cursor: pointer; 
            transition: all 0.2s; 
            text-shadow: 0 0 5px #00ff00;
        }
        .nav-buttons i:hover { color: #fff; text-shadow: 0 0 8px #fff; }

        /* Kolom URL */
        .address-bar {
            flex-grow: 1;
            background: #000000;
            border-radius: 4px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            border: 1px solid #00ff00;
            box-shadow: inset 0 0 8px rgba(0, 255, 0, 0.2);
            min-width: 0; /* Mencegah elemen keluar batas di flexbox */
        }
        .address-bar .fa-terminal {
            color: #00ff00;
            font-size: 13px;
            margin-right: 10px;
            text-shadow: 0 0 5px #00ff00;
        }
        .address-bar input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 14px;
            color: #00ff00;
            background: transparent;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 2px #00ff00;
            text-overflow: ellipsis; /* Menambahkan titik tiga jika teks kepanjangan */
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            color: #00ff00;
            font-size: 16px;
            text-shadow: 0 0 5px #00ff00;
        }

        /* ------------------------- */
        /* KONTEN DALAM BROWSER      */
        /* ------------------------- */
        .browser-content {
            flex-grow: 1;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
        }

        .browser-content::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
        }

        .fake-logo {
            font-size: 60px;
            font-weight: bold;
            color: #00ff00;
            margin-bottom: 30px;
            text-shadow: 0 0 15px #00ff00;
            letter-spacing: 4px;
            z-index: 3;
            text-align: center;
        }
        
        .cursor-blink {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .fake-search {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 600px;
            border: 1px solid #00ff00;
            border-radius: 4px;
            padding: 12px 20px;
            margin-bottom: 30px;
            background: rgba(0, 255, 0, 0.05);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.15);
            transition: all 0.3s;
            z-index: 3;
        }
        .fake-search:focus-within {
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.4);
            background: rgba(0, 255, 0, 0.1);
        }
        .fake-search i { 
            color: #00ff00; 
            margin-right: 15px;
            text-shadow: 0 0 5px #00ff00;
        }
        .fake-search input {
            border: none;
            outline: none;
            flex-grow: 1;
            font-size: 16px;
            color: #00ff00;
            background: transparent;
            font-family: 'Courier New', Courier, monospace;
        }

        .fake-buttons {
            display: flex;
            gap: 20px;
            z-index: 3;
            width: 100%;
            justify-content: center;
        }
        .fake-buttons button {
            background-color: transparent;
            border: 1px solid #00ff00;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 14px;
            padding: 12px 24px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s;
            box-shadow: inset 0 0 5px rgba(0, 255, 0, 0.2);
            white-space: nowrap;
        }
        .fake-buttons button:hover {
            background-color: #00ff00;
            color: #000000;
            box-shadow: 0 0 15px #00ff00;
        }

        /* ------------------------------------------- */
        /* MEDIA QUERIES (UNTUK TAMPILAN MOBILE)       */
        /* ------------------------------------------- */
        @media screen and (max-width: 768px) {
            .browser-header {
                padding: 10px;
                gap: 10px;
            }
            
            /* Sembunyikan tombol navigasi & action agar address bar muat di HP */
            .nav-buttons, .action-buttons {
                display: none;
            }
            
            /* Sesuaikan ukuran logo */
            .fake-logo {
                font-size: 32px;
                letter-spacing: 2px;
            }

            .fake-search {
                padding: 10px 15px;
            }

            .fake-search input {
                font-size: 14px;
            }

            /* Ubah susunan tombol menjadi vertikal (atas-bawah) */
            .fake-buttons {
                flex-direction: column;
                gap: 12px;
                max-width: 300px;
            }
            .fake-buttons button {
                width: 100%;
                padding: 14px 20px;
            }

            /* Perkecil ukuran teks URL */
            .address-bar input {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="browser-window">
        <!-- TOOLBAR -->
        <div class="browser-header">
            <div class="window-controls">
                <div class="dot close"></div>
                <div class="dot minimize"></div>
                <div class="dot maximize"></div>
            </div>

            <div class="nav-buttons">
                <i class="fas fa-chevron-left"></i>
                <i class="fas fa-chevron-right"></i>
                <i class="fas fa-sync-alt"></i>
            </div>

            <div class="address-bar">
                <i class="fas fa-terminal"></i>
                <input type="text" value="root@localhost:~/network/gateway" readonly>
            </div>

            <div class="action-buttons">
                <i class="fas fa-user-secret"></i>
                <i class="fas fa-bars"></i>
            </div>
        </div>

        <!-- KONTEN -->
        <div class="browser-content">
            <div class="fake-logo">
                >_SYSTEM_ROOT<span class="cursor-blink">_</span>
            </div>
            
            <div class="fake-search">
                <i class="fas fa-angle-right"></i>
                <input type="text" placeholder="Enter command or target...">
            </div>

            <div class="fake-buttons">
                <button>Execute Search</button>
                <button>Bypass Firewall</button>
            </div>
        </div>
    </div>

</body>
</html>
