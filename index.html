<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sosmed Minimalis</title>
    <!-- Ikon dari FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; 
        }
        body {
            /* Font modern bawaan sistem */
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5; /* Latar belakang abu-abu sangat terang */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        .mobile-app {
            width: 100%;
            max-width: 480px;
            background: #fafbfc; /* Warna dasar aplikasi */
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            padding-bottom: 40px;
        }
        .header {
            padding: 50px 24px 30px 24px;
        }
        .header h1 {
            font-size: 28px;
            color: #1a1a1a;
            margin: 0 0 8px 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .header p {
            font-size: 15px;
            color: #718096;
            margin: 0;
        }
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 0 24px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            background: #ffffff;
            padding: 16px;
            border-radius: 16px;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            transition: all 0.2s ease;
        }
        /* Efek saat tombol ditekan */
        .menu-item:active {
            transform: scale(0.97);
            box-shadow: 0 1px 4px rgba(0,0,0,0.02);
            background: #f7fafc;
        }
        /* Kotak ikon */
        .icon-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            margin-right: 16px;
        }
        .menu-text {
            font-size: 16px;
            font-weight: 600;
            color: #2d3748;
            flex-grow: 1; /* Mendorong ikon panah ke ujung kanan */
        }
        .arrow {
            color: #cbd5e0;
            font-size: 14px;
        }

        /* Warna Ikon (Teks & Background transparan/pastel) */
        .instagram { color: #E1306C; background: #FCE6EF; }
        .facebook { color: #1877F2; background: #E7F0FD; }
        .twitter { color: #0F1419; background: #E7E9EA; }
        .tiktok { color: #000000; background: #E2E8F0; }
        .whatsapp { color: #25D366; background: #E9F9EE; }
        .telegram { color: #0088CC; background: #E5F3FA; }
    </style>
</head>
<body>

<div class="mobile-app">
    <div class="header">
        <h1>Koneksi</h1>
        <p>Pilih platform untuk terhubung</p>
    </div>
    
    <div class="menu-list">
        <a href="https://www.instagram.com" target="_blank" class="menu-item">
            <div class="icon-box instagram"><i class="fab fa-instagram"></i></div>
            <span class="menu-text">Instagram</span>
            <i class="fas fa-chevron-right arrow"></i>
        </a>
        
        <a href="https://www.facebook.com" target="_blank" class="menu-item">
            <div class="icon-box facebook"><i class="fab fa-facebook-f"></i></div>
            <span class="menu-text">Facebook</span>
            <i class="fas fa-chevron-right arrow"></i>
        </a>
        
        <a href="https://twitter.com" target="_blank" class="menu-item">
            <div class="icon-box twitter"><i class="fa-brands fa-twitter-x"></i></div>
            <span class="menu-text">X (Twitter)</span>
            <i class="fas fa-chevron-right arrow"></i>
        </a>
        
        <a href="https://www.tiktok.com" target="_blank" class="menu-item">
            <div class="icon-box tiktok"><i class="fab fa-tiktok"></i></div>
            <span class="menu-text">TikTok</span>
            <i class="fas fa-chevron-right arrow"></i>
        </a>
        
        <a href="https://api.whatsapp.com/send?text=Halo" target="_blank" class="menu-item">
            <div class="icon-box whatsapp"><i class="fab fa-whatsapp"></i></div>
            <span class="menu-text">WhatsApp</span>
            <i class="fas fa-chevron-right arrow"></i>
        </a>
        
        <a href="https://t.me" target="_blank" class="menu-item">
            <div class="icon-box telegram"><i class="fab fa-telegram-plane"></i></div>
            <span class="menu-text">Telegram</span>
            <i class="fas fa-chevron-right arrow"></i>
        </a>
    </div>
</div>

</body>
</html>
