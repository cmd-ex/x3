<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup Web Browser</title>
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #cbd5e1; /* Warna latar belakang luar browser */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* ------------------------- */
        /* WADAH UTAMA BROWSER       */
        /* ------------------------- */
        .browser-window {
            width: 90%;
            max-width: 1000px;
            height: 80vh;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #b4bcc6;
        }

        /* ------------------------- */
        /* BAGIAN ATAS (TOOLBAR)     */
        /* ------------------------- */
        .browser-header {
            background: #f1f3f4; /* Warna abu-abu ala Chrome */
            padding: 10px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #dadce0;
            gap: 20px;
        }

        /* Tombol Window (Merah, Kuning, Hijau ala Mac) */
        .window-controls {
            display: flex;
            gap: 8px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot.close { background: #ff5f56; }
        .dot.minimize { background: #ffbd2e; }
        .dot.maximize { background: #27c93f; }

        /* Tombol Navigasi (Back, Forward, Refresh) */
        .nav-buttons {
            display: flex;
            gap: 16px;
            color: #5f6368;
            font-size: 16px;
        }
        .nav-buttons i { cursor: pointer; transition: color 0.2s; }
        .nav-buttons i:hover { color: #202124; background: #e8eaed; border-radius: 50%; }

        /* Kolom Pencarian / URL (Address Bar) */
        .address-bar {
            flex-grow: 1;
            background: #ffffff;
            border-radius: 24px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            border: 1px solid #dfe1e5;
        }
        .address-bar:focus-within {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: transparent;
        }
        .address-bar .fa-lock {
            color: #5f6368;
            font-size: 13px;
            margin-right: 12px;
        }
        .address-bar input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 14px;
            color: #202124;
        }
        .address-bar .fa-star {
            color: #5f6368;
            cursor: pointer;
        }

        /* Ikon Ekstensi & Menu */
        .action-buttons {
            display: flex;
            gap: 16px;
            color: #5f6368;
            font-size: 16px;
        }

        /* ------------------------- */
        /* KONTEN DALAM BROWSER      */
        /* (Halaman Fake Google)     */
        /* ------------------------- */
        .browser-content {
            flex-grow: 1;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Logo Google Tiruan */
        .fake-logo {
            font-size: 70px;
            font-weight: 600;
            letter-spacing: -2px;
            margin-bottom: 25px;
            font-family: 'Product Sans', Arial, sans-serif;
        }
        .fake-logo span:nth-child(1) { color: #4285F4; } /* G */
        .fake-logo span:nth-child(2) { color: #EA4335; } /* o */
        .fake-logo span:nth-child(3) { color: #FBBC05; } /* o */
        .fake-logo span:nth-child(4) { color: #4285F4; } /* g */
        .fake-logo span:nth-child(5) { color: #34A853; } /* l */
        .fake-logo span:nth-child(6) { color: #EA4335; } /* e */

        /* Kotak Pencarian Web */
        .fake-search {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 580px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            padding: 12px 20px;
            margin-bottom: 30px;
            transition: box-shadow 0.2s;
        }
        .fake-search:hover {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
        }
        .fake-search i.fa-search { color: #9aa0a6; margin-right: 15px; }
        .fake-search input {
            border: none;
            outline: none;
            flex-grow: 1;
            font-size: 16px;
        }
        .fake-search i.fa-microphone { color: #4285F4; cursor: pointer; }

        /* Tombol Pencarian */
        .fake-buttons {
            display: flex;
            gap: 12px;
        }
        .fake-buttons button {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            padding: 10px 16px;
            cursor: pointer;
        }
        .fake-buttons button:hover {
            border: 1px solid #dadce0;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
            color: #202124;
        }
    </style>
</head>
<body>

    <div class="browser-window">
        <!-- 1. BAGIAN TOOLBAR BROWSER -->
        <div class="browser-header">
            <!-- Tombol Window (Mac Style) -->
            <div class="window-controls">
                <div class="dot close"></div>
                <div class="dot minimize"></div>
                <div class="dot maximize"></div>
            </div>

            <!-- Tombol Back, Forward, Refresh -->
            <div class="nav-buttons">
                <i class="fas fa-arrow-left"></i>
                <i class="fas fa-arrow-right"></i>
                <i class="fas fa-redo"></i>
            </div>

            <!-- Address Bar (Kolom URL) -->
            <div class="address-bar">
                <i class="fas fa-lock"></i>
                <input type="text" value="https://www.google.com" readonly>
                <i class="far fa-star"></i>
            </div>

            <!-- Ikon Menu Kanan -->
            <div class="action-buttons">
                <i class="fas fa-puzzle-piece"></i>
                <i class="fas fa-ellipsis-v"></i>
            </div>
        </div>

        <!-- 2. KONTEN DALAM BROWSER -->
        <div class="browser-content">
            <div class="fake-logo">
                <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
            </div>
            
            <div class="fake-search">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Telusuri Google atau ketik URL">
                <i class="fas fa-microphone"></i>
            </div>

            <div class="fake-buttons">
                <button>Penelusuran Google</button>
                <button>Saya Lagi Beruntung</button>
            </div>
        </div>
    </div>

</body>
</html>
